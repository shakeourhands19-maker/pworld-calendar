name: P-WORLD daily collection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4 pillow playwright

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run P-WORLD collector
        run: |
          python daily_pworld.py

      - name: Run Minrepo collector
        run: |
          python minrepo.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data minrepo_data excluded_urls.json

          git diff --cached --quiet || git commit -m "Update daily P-WORLD and Minrepo data"

          git push
