name: 毎日P-WORLD自動収集

on:
  schedule:
    # 日本時間 06:00
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tesseract OCRセットアップ
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn

      - name: Python依存パッケージ
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: P-WORLD収集・OCR・レイアウト判定
        run: |
          python daily_pworld_actions.py

      - name: スマホ用ページ生成
        run: |
          python build_mobile_site.py

      - name: GitHub Pages用ファイル作成
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 収集データを保存
        uses: actions/upload-artifact@v4
        with:
          name: pworld-data-${{ github.run_id }}
          path: |
            data/
          if-no-files-found: warn
          retention-days: 30
