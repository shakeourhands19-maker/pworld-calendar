name: スマホページ自動デプロイ

on:
  push:
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: GitHub Pages用ファイル作成
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
