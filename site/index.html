<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P-WORLD 告知</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#222;color:#fff;padding:16px;position:sticky;top:0;z-index:2}header strong{font-size:17px}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:53px;z-index:2;overflow-x:auto}nav button{flex:1;min-width:72px;border:0;background:#fff;padding:13px 4px;font-size:14px}nav button.active{font-weight:700;border-bottom:3px solid #222}
main{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
img{max-width:100%;height:auto;border-radius:8px;display:block}.small{color:#777;font-size:13px}.datebtn,.layoutbtn{width:100%;text-align:left;border:0;background:#fff;padding:13px;border-bottom:1px solid #eee;font-size:15px}
.datebtn:last-child,.layoutbtn:last-child{border-bottom:0}h2{margin:4px 0 10px;font-size:20px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid img{width:100%}.layout-title{font-weight:700}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}.calendar-head button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:7px 10px;font-size:16px;line-height:1;min-width:40px}.calendar-title{font-size:18px;font-weight:700;flex:1;text-align:center}.calendar-today{display:block;margin:0 auto 10px;border:1px solid #ddd;background:#fff;border-radius:8px;padding:7px 14px;font-size:14px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.weekday{text-align:center;font-size:12px;color:#777;padding:5px 0}.weekday:first-child{color:#d33}.weekday:last-child{color:#2878c8}
.day{min-height:54px;overflow:hidden;border:0;background:#fafafa;border-radius:8px;padding:5px 3px;text-align:center;font-size:14px;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.day.empty{background:transparent}.day.sunday{color:#d33}.day.saturday{color:#2878c8}.day.today{background:#dff5ff;color:#222;font-weight:700}.day .thumb{display:block;width:100%;height:42px;object-fit:cover;border-radius:5px;margin-top:3px}.day .count{display:block;font-size:11px;color:#666;margin-top:3px}.day.today .count{color:#555}
.layout-card{border:0;background:#fff;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;box-shadow:0 1px 4px #0001}
.layout-card img{width:100%;height:180px;object-fit:contain;background:#f7f7f7}
.layout-meta{padding:8px;text-align:center;font-size:13px}
.layout-meta strong{display:block;font-size:14px;margin-bottom:2px}
.image-button{border:0;background:transparent;padding:0;cursor:pointer;text-align:left;width:100%}
.image-button img{width:100%}
.image-date{padding:3px 0;color:#777;font-size:12px}
.image-actions{display:flex;gap:6px;margin-top:5px}
.image-actions button{flex:1;border:1px solid #ddd;background:#fff;border-radius:7px;padding:6px 4px;font-size:12px}
.layout-sort{display:flex;align-items:center;gap:8px;margin:0 0 10px}.layout-sort span{font-size:13px;color:#666;white-space:nowrap}.layout-sort select{flex:1;border:1px solid #ddd;border-radius:8px;background:#fff;padding:9px 10px;font-size:14px}.search-box{display:flex;gap:7px;margin-bottom:12px}
.search-box input{flex:1;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:14px}
.search-box button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:0 12px}
.modal{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}
.modal.hidden{display:none}
.modal img{max-width:100%;max-height:92vh;object-fit:contain}
.modal-close{position:fixed;top:12px;right:12px;border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:24px;line-height:1}
.search-result{margin-bottom:10px}
.search-result img{width:100%}
.search-result button{border:0;background:#fff;padding:0;width:100%;text-align:left}
.minrepo-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.minrepo-stat{background:#f7f7f7;border-radius:8px;padding:9px;font-size:13px}.minrepo-stat strong{display:block;font-size:16px;margin-top:2px}
.minrepo-table{width:100%;border-collapse:collapse;font-size:12px}.minrepo-table th,.minrepo-table td{border-bottom:1px solid #eee;padding:6px 4px;text-align:right;white-space:nowrap}.minrepo-table th:first-child,.minrepo-table td:first-child{text-align:left;white-space:normal}.section-title{margin:14px 0 7px;font-size:16px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.day{min-height:64px}.minrepo-summary{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><strong>プレイランドハッピー手稲前田店</strong></header>
<nav>
<button id="tabCalendar" class="active" onclick="showTab('calendar')">カレンダー</button>
<button id="tabLayouts" onclick="showTab('layouts')">レイアウト</button>
</nav>
<main>
<section id="calendar">
<div class="card">
<div class="calendar-head"><button onclick="changeYear(-1)" aria-label="前年">≪</button><button onclick="changeMonth(-1)" aria-label="前月">‹</button><div id="calendarTitle" class="calendar-title"></div><button onclick="changeMonth(1)" aria-label="次月">›</button><button onclick="changeYear(1)" aria-label="翌年">≫</button></div>
<button class="calendar-today" onclick="goToday()">今日</button>
<div class="calendar"><div class="weekday">日</div><div class="weekday">月</div><div class="weekday">火</div><div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday">土</div></div>
<div id="calendarGrid" class="calendar"></div>
</div><div id="calendarView"></div>
</section>
<section id="layouts" class="hidden">
<div class="card"><h2>基本レイアウト</h2><div class="layout-sort"><span>並び順</span><select id="layoutSort" onchange="renderLayoutList()"><option value="latest_desc">最終使用順（新）</option><option value="latest_asc">最終使用順（古）</option><option value="count_desc">使用回数順（多）</option><option value="count_asc">使用回数順（少）</option><option value="first_desc">初登場順（新）</option><option value="first_asc">初登場順（古）</option></select></div><div class="search-box"><input id="ocrSearchInput" type="search" placeholder="ポスターの文字を検索（例：周年、OPEN）"><button onclick="searchOCR()">検索</button></div><div id="layoutList" class="grid">読み込み中…</div></div>
<div id="layoutView"></div><div id="ocrView"></div>
</section>
</main>
<div id="imageModal" class="modal hidden" onclick="closeImageModal()"><button class="modal-close" onclick="event.stopPropagation();closeImageModal()">×</button><img id="modalImage" src="" alt="" onclick="event.stopPropagation()"></div>
<script>
let dates=[],layouts=[],minrepoDates={},ocrIndex={};let calendarMonth=new Date();calendarMonth.setDate(1);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localDateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function showTab(tab){['calendar','layouts'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==tab));['tabCalendar','tabLayouts'].forEach(x=>document.getElementById(x).classList.remove('active'));document.getElementById('tab'+tab[0].toUpperCase()+tab.slice(1)).classList.add('active');if(tab==='calendar')renderCalendar()}
function imageHtml(x){return '<div><button class="image-button" onclick="openImageModal(\''+esc(x.url)+'\');event.stopPropagation()"><div class="image-date">'+esc(x.filename)+'</div><img src="'+esc(x.url)+'" alt=""></button></div>'}
function renderImages(items){return items.length?'<div class="grid">'+items.map(imageHtml).join('')+'</div>':'<p class="small">告知画像はありません。</p>'}
function findLayoutForImage(date,filename){return layouts.find(l=>(l.images||[]).some(x=>x.date===date&&x.filename===filename))}
function renderDateImages(date,items){return items.length?'<div class="grid">'+items.map(x=>{const l=findLayoutForImage(date,x.filename);return '<div><button class="image-button" onclick="openImageModal(\''+esc(x.url)+'\');event.stopPropagation()"><div class="image-date">'+esc(x.filename)+'</div><img src="'+esc(x.url)+'" alt=""></button>'+(l?'<div class="image-actions"><button onclick="openLayoutFromDate(\''+esc(l.id)+'\')">同じレイアウト</button></div>':'')+'</div>'}).join('')+'</div>':'<p class="small">告知画像はありません。</p>'}
function openDate(date){const d=dates.find(x=>x.date===date);if(!d)return;document.getElementById('dateView').innerHTML='<div class="card"><h2>'+esc(date)+'</h2>'+renderDateImages(date,d.images)+'</div>';window.scrollTo({top:document.getElementById('dateView').offsetTop-80,behavior:'smooth'})}
function openImageModal(url){document.getElementById('modalImage').src=url;document.getElementById('imageModal').classList.remove('hidden')}
function openLayoutFromDate(id){showTab('layouts');setTimeout(()=>openLayout(id),0)}
function closeImageModal(){document.getElementById('imageModal').classList.add('hidden');document.getElementById('modalImage').src=''}
function formatWinRate(w){if(!w)return '-';if(typeof w==='object'&&w.wins!=null&&w.total!=null)return w.wins+'/'+w.total+' ('+(w.total?((w.wins/w.total)*100).toFixed(1):'0.0')+'%)';return w}
function formatNum(v){return v==null?'-':Number.isFinite(Number(String(v).replace(/,/g,'')))?Number(String(v).replace(/,/g,'')).toLocaleString('ja-JP'):esc(v)}
function renderMinrepo(x){
 const o=x.overall||{};
 const totalDiff=o.total_diff??o['総差枚'];
 const avgDiff=o.average_diff??o['平均差枚'];
 const avgGames=o.average_games??o['平均G数'];
 const winRate=o.win_rate??o['勝率'];
 const summary='<div class="minrepo-summary"><div class="minrepo-stat">総差枚<strong>'+formatNum(totalDiff)+'</strong></div><div class="minrepo-stat">平均差枚<strong>'+formatNum(avgDiff)+'</strong></div><div class="minrepo-stat">平均G数<strong>'+formatNum(avgGames)+'</strong></div><div class="minrepo-stat">勝率<strong>'+formatWinRate(winRate)+'</strong></div></div>';
 const machines=x.machines||[];
 const machineRows=machines.map(v=>'<tr><td>'+esc(v.machine??v['機種']??'-')+'</td><td>'+formatNum(v.average_diff??v['平均差枚'])+'</td><td>'+formatNum(v.average_games??v['平均G数'])+'</td><td>'+formatWinRate(v.win_rate??v['勝率'])+'</td><td>'+formatNum(v.payout_rate??v['出率'])+'</td></tr>').join('');
 const machineTable=machines.length?'<h3 class="section-title">機種別データ</h3><div style="overflow-x:auto"><table class="minrepo-table"><tr><th>機種</th><th>平均差枚</th><th>平均G数</th><th>勝率</th><th>出率</th></tr>'+machineRows+'</table></div>':'<p class="small">機種別データはありません。</p>';
 const numbers=x.machine_numbers||[];
 const numberRows=numbers.map(v=>'<tr><td>'+esc(v.machine??v['機種']??'-')+'</td><td>'+formatNum(v.machine_number??v['台番号'])+'</td><td>'+formatNum(v.diff??v['差枚'])+'</td><td>'+formatNum(v.games??v['G数'])+'</td><td>'+formatNum(v.payout_rate??v['出率'])+'</td></tr>').join('');
 const numberTable=numbers.length?'<h3 class="section-title">台番号別データ</h3><div style="overflow-x:auto"><table class="minrepo-table"><tr><th>機種</th><th>台番号</th><th>差枚</th><th>G数</th><th>出率</th></tr>'+numberRows+'</table></div>':'';
 const tails=x.tails||[];
 const tailRows=tails.map(v=>'<tr><td>'+esc(v.tail??v['末尾']??'-')+'</td><td>'+formatNum(v.average_diff??v['平均差枚'])+'</td><td>'+formatNum(v.average_games??v['平均G数'])+'</td><td>'+formatWinRate(v.win_rate??v['勝率'])+'</td><td>'+formatNum(v.payout_rate??v['出率'])+'</td></tr>').join('');
 const tailTable=tails.length?'<h3 class="section-title">末尾別データ</h3><div style="overflow-x:auto"><table class="minrepo-table"><tr><th>末尾</th><th>平均差枚</th><th>平均G数</th><th>勝率</th><th>出率</th></tr>'+tailRows+'</table></div>':'';
 return '<h3>みんレポ</h3>'+summary+machineTable+numberTable+tailTable+(x.source_url?'<p class="small">出典：<a href="'+esc(x.source_url)+'" target="_blank" rel="noopener">みんレポ</a></p>':'');
}
async function openCalendarDate(date){
 const d=dates.find(x=>x.date===date);const view=document.getElementById('calendarView');
 view.innerHTML='<div class="card"><h2>'+esc(date)+'</h2>'+(d?renderDateImages(date,d.images):'<p class="small">告知画像はありません。</p>')+'<div id="minrepoView"><p class="small">みんレポデータを読み込み中…</p></div></div>';
 window.scrollTo({top:view.offsetTop-80,behavior:'smooth'});
 try{const r=await fetch('minrepo_data/'+date+'.json?'+Date.now());if(!r.ok)throw new Error('not found');const x=await r.json();document.getElementById('minrepoView').innerHTML=renderMinrepo(x)}
 catch(e){document.getElementById('minrepoView').innerHTML='<h3>みんレポ</h3><p class="small">この日のみんレポデータはありません。</p>'}
}
function openLayout(id){const l=layouts.find(x=>x.id===id);if(!l)return;const images=[...(l.images||[])].sort((a,b)=>b.date.localeCompare(a.date));const first=images[0]?.date||'';const last=images[images.length-1]?.date||'';const html=images.length?'<div class="grid">'+images.map(x=>'<div><button type="button" class="image-button" onclick="openLayoutImage(\''+x.date+'\')"><div class="image-date">'+esc(x.date)+'</div><img src="'+esc(x.url)+'" alt=""></button></div>').join('')+'</div>':'<p class="small">画像はありません。</p>';document.getElementById('layoutView').innerHTML='<div class="card"><h2>このレイアウトの過去画像</h2><p class="small">使用回数：'+images.length+'回　初登場：'+esc(last)+'　最終使用：'+esc(first)+'</p>'+html+'</div>';window.scrollTo({top:document.getElementById('layoutView').offsetTop-80,behavior:'smooth'})}
function openLayoutImage(date){showTab('calendar');const y=Number(date.slice(0,4)),m=Number(date.slice(5,7))-1;calendarMonth=new Date(y,m,1);renderCalendar();setTimeout(()=>openCalendarDate(date),0)}
function layoutDates(l){
 const dates=(l.images||[]).map(x=>x.date).filter(Boolean).sort();
 return {first:dates[0]||'',latest:dates[dates.length-1]||''};
}
function renderLayoutList(){
 const select=document.getElementById('layoutSort');
 const sort=select?select.value:'latest_desc';
 const sorted=[...layouts].sort((a,b)=>{
   const ad=layoutDates(a),bd=layoutDates(b);
   if(sort==='latest_desc') return bd.latest.localeCompare(ad.latest)||b.count-a.count;
   if(sort==='latest_asc') return ad.latest.localeCompare(bd.latest)||b.count-a.count;
   if(sort==='count_desc') return b.count-a.count||bd.latest.localeCompare(ad.latest);
   if(sort==='count_asc') return a.count-b.count||bd.latest.localeCompare(ad.latest);
   if(sort==='first_desc') return bd.first.localeCompare(ad.first)||b.count-a.count;
   if(sort==='first_asc') return ad.first.localeCompare(bd.first)||b.count-a.count;
   return 0;
 });
 document.getElementById('layoutList').innerHTML=sorted.map(x=>{
   const d=layoutDates(x);
   return '<button class="layout-card" onclick="openLayout(\\''+x.id+'\\')"><img src="'+esc(x.representative)+'" alt=""><div class="layout-meta"><strong>'+x.count+'回使用</strong>最終使用 '+esc(d.latest)+'</div></button>';
 }).join('')||'<p class="small">まだレイアウトデータがありません。</p>';
}
function searchOCR(){const q=document.getElementById('ocrSearchInput').value.trim().toLowerCase();const view=document.getElementById('ocrView');if(!q){view.innerHTML='';return}const hits=Object.entries(ocrIndex).filter(([k,v])=>String(v.text||'').toLowerCase().includes(q));if(!hits.length){view.innerHTML='<div class="card"><p class="small">「'+esc(q)+'」を含むOCRデータはありません。</p></div>';return}view.innerHTML='<div class="card"><h2>OCR検索結果</h2>'+hits.map(([key,v])=>'<div class="search-result"><button onclick="openLayoutImage(\''+key.split('/')[0]+'\')"><img src="'+esc(v.url)+'" alt=""><div class="image-date">'+esc(key.split('/')[0])+' / '+esc(key.split('/')[1])+'</div></button></div>').join('')+'</div>'}
function openLayoutImage(date){showTab('calendar');const y=Number(date.slice(0,4)),m=Number(date.slice(5,7))-1;calendarMonth=new Date(y,m,1);renderCalendar();setTimeout(()=>openCalendarDate(date),0);}
function changeMonth(diff){calendarMonth.setMonth(calendarMonth.getMonth()+diff);renderCalendar()}
function changeYear(diff){calendarMonth.setFullYear(calendarMonth.getFullYear()+diff);renderCalendar()}
function goToday(){const now=new Date();calendarMonth=new Date(now.getFullYear(),now.getMonth(),1);renderCalendar()}
function renderCalendar(){
 const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth();
 const firstDay=new Date(y,m,1).getDay();
 const lastDate=new Date(y,m+1,0).getDate();
 const todayKey=localDateKey();
 const byDate={};
 dates.forEach(x=>{byDate[x.date]=x;});
 document.getElementById('calendarTitle').textContent=y+'年'+(m+1)+'月';
 let html='';
 for(let i=0;i<firstDay;i++) html+='<div class="day empty"></div>';
 for(let d=1;d<=lastDate;d++){
  const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const item=byDate[key];
  const count=item&&Array.isArray(item.images)?item.images.length:0;
  const hasMinrepo=!!minrepoDates[key];
  const weekDay=new Date(y,m,d).getDay();
  const cls=['day',weekDay===0?'sunday':'',weekDay===6?'saturday':'',key===todayKey?'today':''].filter(Boolean).join(' ');
  let thumb='';
  if(count>0 && item.images[0] && item.images[0].url){
   thumb='<img class="thumb" src="'+esc(item.images[0].url)+'" alt="">';
  }
  const clickable=count>0||hasMinrepo;
  const onclick=clickable?' onclick="openCalendarDate(\''+key+'\')"':'';
  html+='<button type="button" class="'+cls+'"'+onclick+'>'+d+thumb+(count?'<span class="count">'+count+'枚</span>':'')+'</button>';
 }
 document.getElementById('calendarGrid').innerHTML=html;
}
async function load(){
 const [d,l,mi,o]=await Promise.all([fetch('dates.json?'+Date.now()),fetch('layouts.json?'+Date.now()),fetch('minrepo_data/index.json?'+Date.now()),fetch('ocr_index.json?'+Date.now())]);
 dates=await d.json();layouts=await l.json();const minrepoIndex=await mi.json();try{ocrIndex=await o.json()}catch(e){ocrIndex={}}
 if(Array.isArray(minrepoIndex)){minrepoIndex.forEach(x=>{if(typeof x==='string')minrepoDates[x]=true;else if(x&&x.date)minrepoDates[x.date]=true})}
  renderLayoutList();
 renderCalendar()
}
load().catch(e=>document.getElementById('calendarGrid').textContent='データの読み込みに失敗しました。');
</script>
</body>
</html>
