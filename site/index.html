<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P-WORLD 告知</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#222;color:#fff;padding:16px;position:sticky;top:0;z-index:2}header strong{font-size:17px}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:53px;z-index:2}nav button{flex:1;border:0;background:#fff;padding:13px 4px;font-size:15px}nav button.active{font-weight:700;border-bottom:3px solid #222}
main{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
img{max-width:100%;height:auto;border-radius:8px;display:block}.small{color:#777;font-size:13px}.datebtn,.layoutbtn{width:100%;text-align:left;border:0;background:#fff;padding:13px;border-bottom:1px solid #eee;font-size:15px}.datebtn:last-child,.layoutbtn:last-child{border-bottom:0}
h2{margin:4px 0 10px;font-size:20px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid img{width:100%}.layout-title{font-weight:700}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><strong>プレイランドハッピー手稲前田店</strong></header>
<nav><button id="tabToday" class="active" onclick="showTab('today')">今日</button><button id="tabDates" onclick="showTab('dates')">過去</button><button id="tabLayouts" onclick="showTab('layouts')">レイアウト</button></nav>
<main>
<section id="today">
<div class="card"><h2>今日の告知</h2><div id="todayContent">読み込み中…</div></div>
</section>
<section id="dates" class="hidden">
<div class="card"><h2>過去の告知</h2><div id="dateList">読み込み中…</div></div>
<div id="dateView"></div>
</section>
<section id="layouts" class="hidden">
<div class="card"><h2>基本レイアウト</h2><div id="layoutList">読み込み中…</div></div>
<div id="layoutView"></div>
</section>
</main>
<script>
let dates=[],layouts=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showTab(tab){
 ['today','dates','layouts'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==tab));
 ['tabToday','tabDates','tabLayouts'].forEach(x=>document.getElementById(x).classList.remove('active'));
 document.getElementById('tab'+tab[0].toUpperCase()+tab.slice(1)).classList.add('active');
}
function imageHtml(x){return '<div><div class="small">'+esc(x.filename)+'</div><img src="'+x.url+'"></div>'}
function renderImages(items){return items.length?'<div class="grid">'+items.map(imageHtml).join('')+'</div>':'<p class="small">告知画像はありません。</p>'}
function openDate(date){
 const d=dates.find(x=>x.date===date); if(!d)return;
 document.getElementById('dateView').innerHTML='<div class="card"><h2>'+esc(date)+'</h2>'+renderImages(d.images)+'</div>';
 window.scrollTo({top:document.getElementById('dateView').offsetTop-80,behavior:'smooth'});
}
function openLayout(id){
 const l=layouts.find(x=>x.id===id); if(!l)return;
 document.getElementById('layoutView').innerHTML='<div class="card"><h2>'+esc(id)+' <span class="small">('+l.count+'件)</span></h2>'+renderImages(l.images)+'</div>';
 window.scrollTo({top:document.getElementById('layoutView').offsetTop-80,behavior:'smooth'});
}
async function load(){
 const [t,d,l]=await Promise.all([
  fetch('today.json?'+Date.now()),fetch('dates.json?'+Date.now()),fetch('layouts.json?'+Date.now())
 ]);
 const today=await t.json(); dates=await d.json(); layouts=await l.json();
 document.getElementById('todayContent').innerHTML=renderImages(today.images||[]);
 document.getElementById('dateList').innerHTML=dates.map(x=>'<button class="datebtn" onclick="openDate(\''+x.date+'\')">'+esc(x.date)+' <span class="small">('+x.images.length+'枚)</span></button>').join('');
 document.getElementById('layoutList').innerHTML=layouts.map(x=>'<button class="layoutbtn" onclick="openLayout(\''+x.id+'\')"><span class="layout-title">'+esc(x.id)+'</span> <span class="small">('+x.count+'件)</span></button>').join('')||'<p class="small">まだレイアウトデータがありません。</p>';
}
load().catch(e=>document.getElementById('todayContent').textContent='データの読み込みに失敗しました。');
</script>
</body>
</html>
