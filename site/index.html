<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P-WORLD 告知</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#222;color:#fff;padding:16px}
main{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0001}
img{max-width:100%;height:auto;border-radius:8px}
.small{color:#777;font-size:14px}
</style>
</head>
<body>
<header><strong>プレイランドハッピー手稲前田店</strong></header>
<main>
<div class="card">
<h2>今日の告知</h2>
<p class="small">自動収集された最新情報を表示します。</p>
<div id="today">読み込み中…</div>
</div>
</main>
<script>
async function load(){
 const r=await fetch("today.json?"+Date.now());
 if(!r.ok){document.getElementById("today").textContent="本日のデータはまだありません。";return}
 const d=await r.json();
 const el=document.getElementById("today");
 if(!d.images||!d.images.length){el.textContent="本日の採用告知はありません。";return}
 el.innerHTML=d.images.map(x=>'<div style="margin-top:16px"><div class="small">'+x.filename+'</div><img src="'+x.url+'"></div>').join("");
}
load();
</script>
</body>
</html>
